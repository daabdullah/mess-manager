<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AB0FF"/>
      <stop offset="1" stop-color="#0A60E8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#DCE9FF"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00266B" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sq"><rect width="512" height="512" rx="115"/></clipPath>
  </defs>

  <!-- squircle background -->
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <ellipse cx="256" cy="-20" rx="360" ry="260" fill="url(#glow)"/>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>

  <g filter="url(#shadow)">
    <!-- chef toque -->
    <g fill="url(#hat)">
      <circle cx="200" cy="150" r="46"/>
      <circle cx="256" cy="124" r="56"/>
      <circle cx="314" cy="150" r="46"/>
      <rect x="182" y="150" width="148" height="70" rx="10"/>
    </g>
    <rect x="182" y="206" width="148" height="18" rx="6" fill="#BBD3FA"/>

    <!-- bowl -->
    <path d="M110 262 H402 C402 352 340 414 256 414 C172 414 110 352 110 262 Z" fill="url(#bowl)"/>
    <rect x="96" y="250" width="320" height="24" rx="12" fill="#fff"/>
    <!-- bowl stripe -->
    <path d="M132 318 C190 340 322 340 380 318" fill="none" stroke="#FF9F0A" stroke-width="14" stroke-linecap="round"/>
    <!-- base -->
    <rect x="206" y="410" width="100" height="22" rx="11" fill="#CFE0FB"/>
  </g>

  <!-- steam -->
  <g fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="12" stroke-linecap="round">
    <path d="M150 232 c-14 -16 14 -26 0 -44"/>
    <path d="M362 232 c-14 -16 14 -26 0 -44"/>
  </g>
</svg>
