<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>Mess Manager</title>
    <script>
      // Set theme and performance mode before the first paint, so nothing flashes.
      try {
        var r = document.documentElement, s = localStorage, n = navigator, m = function (q) { return window.matchMedia(q); };
        var t = s.getItem('mm-theme'), p = s.getItem('mm-perf');
        r.dataset.theme = t === 'light' || t === 'dark' ? t : m('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var low = (n.deviceMemory && n.deviceMemory <= 4) || (n.hardwareConcurrency && n.hardwareConcurrency <= 4) || m('(prefers-reduced-motion: reduce)').matches;
        r.dataset.perf = p === 'lite' || p === 'full' ? p : low ? 'lite' : 'full';
      } catch (e) {}
    </script>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="liquid-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
